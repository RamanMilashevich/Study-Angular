<div>
  <h2>Parent</h2>
  <p>Object property: {{ data.name }}</p>
  <app-child [childData]="data" (dataChanged)="onDataChanged($event)"></app-child>
  <button (click)="changeProperty()">Mutate property</button>
  <button (click)="changeReference()">Change reference</button>
  <button (click)="triggerManualChangeDetection()">Trigger manual change detection</button>
</div>
