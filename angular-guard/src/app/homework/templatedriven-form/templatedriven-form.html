<form #myForm="ngForm" (ngSubmit)="onSubmit(myForm)">
  <!-- <input type="number" placeholder="Your age" name="age" [(ngModel)]="user.age" required> -->
  <input type="text" placeholder="Your name" name="name" [(ngModel)]="user.name" minlength="3" required>
  <!-- <input type="text" placeholder="Your surname" name="surname" [(ngModel)]="user.surname" minlength="3" required> -->
  <input type="email" placeholder="Your email" name="email" [(ngModel)]="user.email" required #email="ngModel">
  <div *ngIf="email.pristine && email.invalid" style="color: red">
    Please enter a valid email
  </div>
  <input type="password" placeholder="Your password" name="password" [(ngModel)]="user.password" required>

  <div ngModelGroup="address">
    <input name="street" required placeholder="Street">
    <!--  ngModel The element is registered as a form control and participates in the Angular form (template-driven form). -->

    <input name="city" ngModel required placeholder="City" [(ngModel)]="user.code" />
  </div>
  <button type="submit" [disabled]="myForm.invalid">Send</button>
</form>

<!--
The pattern attribute in an Angular (and HTML) input element is used to enforce that the input value matches a specific format defined by a regular expression (regex). It is useful for validating inputs that need to conform to certain rules, like phone numbers, postal codes, usernames, or passwords with specific requirements.

Why use the pattern attribute:
To validate user input against complex rules on the client side without custom code.

To ensure the value matches expected format before submission.

Works with template-driven and reactive forms for declarative validation.

Works with a variety of input types (text, email, password, etc.).

Examples of pattern usage in Angular template-driven forms
Only digits (number) input

xml
<input
  name="phone"
  ngModel
  pattern="^[0-9]{10}$"
  #phone="ngModel"
  placeholder="Enter 10-digit phone number"
  required
/>
<div *ngIf="phone.invalid && phone.touched" style="color: red;">
  Phone number must be 10 digits.
</div>
Explanation: This pattern checks that the input consists of exactly 10 digits.

Password with at least one uppercase, one lowercase, one digit, and minimum 8 characters

xml
<input
  type="password"
  name="password"
  ngModel
  pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
  #password="ngModel"
  placeholder="Password"
  required
/>
<div *ngIf="password.invalid && password.touched" style="color: red;">
  Password must contain at least 8 characters, including uppercase, lowercase, and a number.
</div>
Explanation: This regex asserts the password contains the required character groups.

Username: Only letters and numbers, 3 to 15 characters

xml
<input
  name="username"
  ngModel
  pattern="^[a-zA-Z0-9]{3,15}$"
  #username="ngModel"
  placeholder="Username"
  required
/>
<div *ngIf="username.invalid && username.touched" style="color: red;">
  Username must be 3-15 characters, letters and numbers only.
</div>
Summary
The pattern attribute uses regular expressions to declaratively validate input format.

It compliments other validators (required, minlength, etc.) for fine-grained validation.

Angular automatically tracks validity via this pattern and updates CSS classes like ng-valid or ng-invalid.

You can show error messages based on the validator state. -->
